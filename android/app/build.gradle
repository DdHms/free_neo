plugins {
    id 'com.android.application' version '8.13.2'
}
android {
    namespace 'dev.freeneo.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.freeneo.app'
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
